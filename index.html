<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4 fw-bold text-primary">Registro de Usuario</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
                                    <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="ciudad" class="form-label fw-semibold">Ciudad de residencia</label>
                                <select class="form-select" id="ciudad" required>
                                    <option selected disabled value="">Selecciona una opción...</option>
                                    <option value="bogota">Bogotá</option>
                                    <option value="medellin">Medellín</option>
                                    <option value="cali">Cali</option>
                                    <option value="manizales">Manizales</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Modalidad</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="modalidad" id="presencial" value="presencial" required>
                                    <label class="form-check-label" for="presencial">Presencial</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="modalidad" id="virtual" value="virtual" required>
                                    <label class="form-check-label" for="virtual">Virtual</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="comentarios" class="form-label fw-semibold">Comentarios</label>
                                <textarea class="form-control" id="comentarios" rows="3" placeholder="Déjanos un mensaje..."></textarea>
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="terminos" required>
                                <label class="form-check-label text-muted" for="terminos">
                                    Acepto los términos y condiciones de privacidad
                                </label>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Registro</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
